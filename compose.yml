---
services:
  api:
    build: ./code/flask/
    ports:
      - "8081"

  nginx:
    image: nginx:latest
    ports:
      - "8081:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./code/public_html:/usr/share/nginx/html

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: playsync
      POSTGRES_PASSWORD: 3308SP21
      POSTGRES_DB: playsync_alpha
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
    driver: local